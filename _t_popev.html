<style>
@font-face{font-family:'PlanUI';src:url(font-ui.woff2?v=d39c897d) format('woff2');font-weight:normal;font-style:normal;font-display:swap;}
@font-face{font-family:'PlanHead';src:url(font-head.woff2?v=d39c897d) format('woff2');font-weight:normal;font-style:normal;font-display:swap;}
@font-face{font-family:'PlanHand';src:url(font-hand.woff2?v=d39c897d) format('woff2');font-weight:normal;font-style:normal;font-display:swap;}

/* ── 색·간격 토큰 ──────────────────────────────────────────
   화면 크롬은 흑연색으로 눌러 두고, 진한 색은 **분류·활동 색에만** 쓴다.
   달력과 히트맵이 색으로 읽히는 화면이라, 크롬까지 색을 쓰면 무엇이 일정인지 안 보인다. */
:root{
  --bg:#f4f5f7; --card:#fff; --paper:#fcfcfa; --ink:#1e242b; --dim:#6b747d;
  --line:#e2e5e9; --rule:#eceef1; --accent:#2f5d8a; --today:#1e242b;
  --cell:#e8ebee; --cell2:#f5f6f8; --sun:#c0503f; --sat:#3d6ea8; --ok:#2f9160;
  --ln:#c6cbd1;
  --sh:0 1px 2px rgba(20,26,32,.05), 0 8px 24px rgba(20,26,32,.05);
  --ui:"PlanUI","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --head:"PlanHead","PlanUI","Malgun Gothic",sans-serif;
  --hand:"PlanHand","PlanUI","Malgun Gothic",sans-serif;
  --hl:#e08a2e;                       /* 형광 주황 — 날짜·TOTAL TIME */
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181c; --card:#1c2126; --paper:#1a1f24; --ink:#e6e9ec; --dim:#98a1aa;
         --line:#2b3238; --rule:#252b31; --accent:#7aa6d2; --today:#e6e9ec;
         --cell:#262d33; --cell2:#1f252a; --sun:#e08b7c; --sat:#8fb4dc; --ok:#6bbd90;
         --ln:#3c444b;
         --hl:#eba95e;
         --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%; }
/* 사람이 적어 넣은 글자만 손글씨체 — 라벨·숫자는 제목체로 둔다 */
.hand,input,textarea{ font-family:var(--hand); }

/* ── 머리 ─────────────────────────────────────────────── */
header{ position:sticky; top:0; z-index:20; background:var(--card);
  border-bottom:1px solid var(--line); padding:13px 10px;
  padding-top:calc(13px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:6px; }
header b{ flex:1; text-align:center; font-size:19px; font-weight:normal;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header button{ background:none; border:0; color:var(--dim); font:inherit; font-size:13.5px;
  cursor:pointer; padding:6px 8px; border-radius:8px; display:flex; align-items:center;
  gap:5px; min-width:66px; }
header button:disabled{ visibility:hidden; }
header #gear{ justify-content:flex-end; }
.tri{ width:0; height:0; border-right:6px solid currentColor;
  border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }

main{ max-width:760px; margin:0 auto; padding:12px 12px 64px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--sh); padding:14px 16px; margin:0 0 12px; }
h2{ font-size:12px; letter-spacing:.14em; color:var(--dim); margin:22px 8px 8px;
  text-transform:uppercase; display:flex; align-items:baseline; gap:8px; }
h2 .r{ margin-left:auto; letter-spacing:0; text-transform:none; font-size:12px; }
.empty{ text-align:center; color:var(--dim); font-size:13.5px; padding:22px 10px; }
.hint{ font-size:11.5px; color:var(--dim); margin-top:7px; line-height:1.5; }

/* ── 월 달력 ──────────────────────────────────────────── */
.mnav{ display:flex; align-items:center; gap:4px; padding:2px 4px 10px; }
.mnav .m{ font-family:var(--head); font-size:26px; letter-spacing:-.02em; }
.mnav .y{ font-size:13px; color:var(--dim); margin-left:7px; }
.mnav .sp{ flex:1; }
.mnav button{ background:none; border:0; color:var(--dim); font:inherit; cursor:pointer;
  padding:7px 10px; border-radius:10px; font-size:15px; }
.mnav button.t{ border:1px solid var(--line); font-size:12.5px; padding:6px 11px; }
.mnav button:active{ background:var(--bg); }

.cal{ background:var(--card); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--sh); overflow:hidden; }
.wk{ display:grid; grid-template-columns:repeat(7,1fr); padding:9px 0 7px;
  border-bottom:1px solid var(--line); }
.wk span{ text-align:center; font-size:11.5px; color:var(--dim); }
.wk span:first-child{ color:var(--sun); } .wk span:last-child{ color:var(--sat); }

.wrow{ position:relative; border-top:1px solid var(--rule); min-height:70px;
  padding:0 0 6px; }
.wrow:first-child{ border-top:0; }
.hit{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,1fr); }
.hit button{ background:none; border:0; padding:0; cursor:pointer;
  border-left:1px solid var(--rule); }
.hit button:first-child{ border-left:0; }
.hit button:active{ background:var(--bg); }
.hit button.out{ opacity:.45; }
.nums{ position:relative; display:grid; grid-template-columns:repeat(7,1fr);
  pointer-events:none; padding:7px 0 4px; }
.nums span{ justify-self:center; font-size:13px; width:24px; height:24px; line-height:24px;
  text-align:center; border-radius:50%; font-variant-numeric:tabular-nums; }
.nums span.s0{ color:var(--sun); } .nums span.s6{ color:var(--sat); }
.nums span.out{ opacity:.32; }
.nums span.now{ background:var(--today); color:var(--card); }
.bars{ position:relative; display:grid; grid-template-columns:repeat(7,1fr);
  grid-auto-rows:17px; gap:2px; pointer-events:none; }
.bar{ display:block; min-width:0; border:0; padding:0 5px; margin:0 1px; cursor:pointer;
  pointer-events:auto;
  background:color-mix(in oklab, var(--c) 16%, var(--card));
  color:color-mix(in oklab, var(--c) 72%, var(--ink));
  border-left:3px solid var(--c); border-radius:4px;
  font:inherit; font-size:11px; line-height:17px; text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar.mid,.bar.end{ border-left-width:0; padding-left:6px;
  border-top-left-radius:0; border-bottom-left-radius:0; }
.bar.mid,.bar.start{ border-top-right-radius:0; border-bottom-right-radius:0; }
.bar.more{ background:none; color:var(--dim); border-left:0; font-size:10.5px; }
@supports not (background: color-mix(in oklab, red 10%, blue)){
  .bar{ background:var(--bg); color:var(--ink); }
}

/* ── 주간계획 — 요일 가로 7열 ──────────────────────────────
   한 칸이 하루. 일정은 칩으로, 활동 시간은 세로 막대로 쌓인다. */
.wk7{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
  align-items:stretch; }
.wk7 .col{ display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 3px 9px; border-radius:15px; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--sh);
  text-decoration:none; color:inherit; min-width:0; }
.wk7 .col:active{ background:var(--bg); }
.wk7 .col.now{ border-color:var(--ink); }
.wk7 .wd{ font-size:10px; font-weight:normal; color:var(--dim); }
.wk7 .col.s0 .wd{ color:var(--sun); } .wk7 .col.s6 .wd{ color:var(--sat); }
.wk7 .dn{ font-size:15px; width:23px; height:23px; line-height:23px; text-align:center;
  border-radius:50%; font-variant-numeric:tabular-nums; }
.wk7 .col.s0 .dn{ color:var(--sun); } .wk7 .col.s6 .dn{ color:var(--sat); }
.wk7 .col.now .dn{ background:var(--today); color:var(--card); }
.wk7 .cev{ display:flex; flex-direction:column; gap:2px; width:100%; min-height:30px; }
.wk7 .chip{ font-style:normal; display:block; font-size:9px; line-height:13px;
  padding:0 2px 0 3px; border-left:2px solid var(--c); border-radius:3px;
  background:color-mix(in oklab, var(--c) 15%, var(--card));
  color:color-mix(in oklab, var(--c) 70%, var(--ink));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wk7 .chip.more{ border-left:0; background:none; color:var(--dim); padding-left:3px; }
.wk7 .bar{ display:flex; flex-direction:column; justify-content:flex-end; gap:1px;
  width:13px; height:48px; margin-top:auto; padding:0; border:0; background:none;
  pointer-events:none; }
.wk7 .bar em{ display:block; width:100%; background:var(--c); border-radius:2px; }
.wk7 .tot{ font-size:9.5px; color:var(--ink); font-variant-numeric:tabular-nums; }
.wk7 .tk{ font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums; }

/* 타일 — 라벨 작게, 숫자 크게 */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 12px; }
.tile{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:10px 14px 11px; box-shadow:var(--sh); }
.tile .k{ font-size:11.5px; color:var(--dim); letter-spacing:-.01em; }
.tile .v{ font-family:var(--head); font-size:21px; line-height:1.25; font-variant-numeric:tabular-nums; }
.tile .v u{ font-size:12.5px; color:var(--dim); text-decoration:none; margin-left:3px; }
.tile .s{ font-size:11.5px; color:var(--dim); margin-top:1px; }
.tile.hot .v{ color:var(--accent); }

/* ── 텐미닛 플래너 (하루 한 장) ────────────────────────────
   속지를 그대로 옮긴다: 라벨은 **회색 + 뒤로 이어지는 줄**, 표와 타임테이블 선도 모두 회색.
   글씨(사람이 적은 것)만 잉크색이다. */
.sheet{ background:var(--paper); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--sh); padding:17px 15px 18px; margin:0 0 12px; }

/* 라벨 — YEAR / MONTH / DAY ─────────── */
.fl{ display:flex; align-items:center; gap:7px; margin:0 0 4px;
  font-family:var(--ui); font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--dim); }
.fl i{ flex:1; height:1px; background:var(--ln); }
.fl > span{ letter-spacing:0; text-transform:none; font-size:11px;
  font-variant-numeric:tabular-nums; }
.fl > button{ background:none; border:0; color:var(--dim); font:inherit; font-size:16px;
  line-height:1; cursor:pointer; padding:0 2px; }
.fl.bare i{ display:none; }

/* 머리 두 줄 — 날짜·D-DAY / COMMENT·TOTAL TIME */
.fgrid{ display:grid; grid-template-columns:1.3fr 1fr; gap:0 13px; }
/* 두 띠(날짜 / 코멘트)의 높이와 간격을 같게 둔다 — 속지가 그렇다 */
.fc{ min-width:0; display:flex; flex-direction:column; justify-content:space-between;
  min-height:52px; padding-bottom:6px; margin-bottom:12px; }
.fc.rule{ border-bottom:1px solid var(--ln); }
.fv{ display:block; width:100%; min-height:24px; border:0; background:none; padding:0;
  outline:none; color:var(--ink); font-family:var(--hand); font-size:16px; }
/* 260820 목요일 — 한 줄로, 칸 너비를 꽉 채우게. 사진처럼 큼직한 형광 주황. */
.fv.big{ font-family:var(--head); font-size:clamp(21px, 7.4vw, 34px); line-height:1.08;
  letter-spacing:-.02em; white-space:nowrap; color:var(--hl);
  font-variant-numeric:tabular-nums; }
.fv.dd small{ display:block; font-family:var(--head); font-size:11px;
  color:var(--dim); letter-spacing:0; line-height:1.4; }
.fv.dd{ font-family:var(--head); font-size:clamp(19px, 6.4vw, 28px); line-height:1.1;
  color:var(--sun); text-align:right; font-variant-numeric:tabular-nums; }
.fv.tot{ font-family:var(--head); font-size:clamp(20px, 6.8vw, 30px); text-align:right;
  color:var(--hl); line-height:1.1; font-variant-numeric:tabular-nums; }

/* 그날 일정 (속지에 없는 칸 — 같은 서식으로 붙인다) */
.evstrip{ margin-bottom:14px; }
.ev{ display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer;
  border-left:3px solid var(--c); padding:1px 0 1px 7px; margin-bottom:3px; }
.ev .tm{ font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums;
  font-family:var(--head); margin-left:auto; white-space:nowrap; }

/* TASKS 와 TIMETABLE — 속지처럼 좌우 2단 */
.cols{ display:grid; grid-template-columns:minmax(0,1fr) 126px; gap:9px;
  align-items:start; }
@media (min-width:560px){ .cols{ grid-template-columns:minmax(0,1fr) 150px; gap:16px; } }
.cols .lt{ min-width:0; }

/* 할 일 표 — 과목칸 │ 본문 │ 체크칸, 가로 괘선 */
.ftable{ border-top:1px solid var(--ln); }
.frow{ display:grid; grid-template-columns:32px minmax(0,1fr) 36px;
  border-bottom:1px solid var(--ln); min-height:30px; }
.frow > span{ display:flex; align-items:center; min-width:0; }
.frow .g{ justify-content:flex-end; padding-right:4px; font-family:var(--ui); font-size:10px;
  line-height:1.15; color:var(--dim); }
.frow .m{ border-left:1px solid var(--ln); padding:0 1px 0 5px; gap:4px; }
.frow .m .run{ margin-left:auto; }
.frow .r{ border-left:1px solid var(--ln); justify-content:center; gap:1px; }
.frow.blank{ cursor:text; }
.frow.blank:active{ background:var(--bg); }
/* 제목은 **형광펜으로 그은 것처럼** 워시색 알약을 깔고 그 위에 손글씨 */
.frow .ttl{ flex:0 1 auto; max-width:100%; display:flex; align-items:center; gap:4px;
  border:0; background:var(--w); border-radius:5px; padding:3px 8px; cursor:pointer;
  text-align:left; color:var(--ink); font-size:13.5px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.frow .ttl:empty{ background:none; }
.frow .ttl .md{ flex:0 0 auto; width:4px; height:4px; border-radius:50%;
  background:var(--dim); opacity:.55; }
.frow.st1 .ttl{ color:var(--dim); text-decoration:line-through; }
.frow.st2 .ttl{ color:var(--dim); }
.frow .run,.frow .mk{ flex:0 0 auto; background:none; border:0; cursor:pointer;
  color:var(--dim); opacity:.4; line-height:1; font-family:var(--head); }
.frow .run{ font-size:10px; padding:3px 2px; }
.frow .mk{ font-size:14px; padding:3px 1px; }
.frow.st1 .mk.ok{ color:var(--ok); opacity:1; }
.frow.st2 .mk.no{ color:var(--sun); opacity:1; }
.frow.run{ background:color-mix(in oklab, var(--accent) 8%, transparent); }
.frow.run .run{ color:var(--accent); opacity:1; }

/* 타임테이블 — 속지의 모눈 그대로, 칠한 칸이 히트맵이 된다 */
.tt{ touch-action:none; user-select:none; -webkit-user-select:none; }
.hm .ttr{ display:flex; align-items:stretch; gap:3px; }
.hm .hr{ flex:0 0 12px; display:flex; align-items:center; justify-content:flex-end;
  font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums; }
.hm .cells{ flex:1; min-width:0; display:grid; grid-template-columns:repeat(6,1fr);
  border-left:1px solid var(--ln); }
.hm .cells i{ aspect-ratio:1; border-right:1px solid var(--ln);
  border-bottom:1px solid var(--ln); }
.hm .ttr.hd .cells{ border-left:0; }
.hm .ttr.hd .cells i{ border:0; height:auto; font-style:normal; font-size:8px;
  color:var(--dim); text-align:center; line-height:1.6;
  font-variant-numeric:tabular-nums; }
.hm .ttr:nth-child(2) .cells i{ border-top:1px solid var(--ln); }
.hm .ttr.dawn .cells i{ background:var(--cell2); }
.hm .ttr.dawn .hr{ opacity:.55; }
.hm .cells i.on{ background:var(--w); }
@media (min-width:560px){
  .hm .hr{ font-size:11px; flex:0 0 15px; }
  .hm .ttr.hd .cells i{ font-size:10px; }
}

/* 칠할 색 고르기 — 활동 이름표는 할 일 팝업으로 갔고, 여기는 색만 남는다 */
.pal{ display:flex; gap:4px; justify-content:flex-end; margin-top:6px; }
.pal button{ width:17px; height:17px; padding:0; border-radius:4px; cursor:pointer;
  border:1px solid var(--ln); background:var(--w); opacity:.6; }
.pal button.on{ opacity:1; border-color:var(--c); box-shadow:0 0 0 1px var(--c) inset; }
.pal .er{ background:none; border-color:var(--ln); color:var(--dim); font:inherit;
  font-size:11px; line-height:1; opacity:1; }
.pal .er.on{ border-color:var(--ink); color:var(--ink); }

textarea.memo{ width:100%; margin-top:2px; min-height:84px; resize:vertical; border:0;
  background:repeating-linear-gradient(var(--paper) 0 27px, var(--ln) 27px 28px);
  line-height:28px; color:var(--ink); font-size:15px; outline:none; padding:0; }

/* 집중도 */
.focus{ display:flex; align-items:center; gap:9px; margin:14px 0 16px; }
.focus .bars5{ display:flex; gap:4px; flex:1; }
.focus .bars5 button{ flex:1; height:26px; border:1px solid var(--line); background:none;
  border-radius:7px; cursor:pointer; color:var(--dim); font:inherit; font-size:11.5px; }
.focus .bars5 button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

@media (prefers-color-scheme: dark){
  .hm .cells i.on{ background:color-mix(in oklab, var(--c) 62%, #12161a); }
  .frow .ttl{ background:color-mix(in oklab, var(--c) 34%, #12161a); }
  .pal button{ background:color-mix(in oklab, var(--c) 62%, #12161a); }
}

/* ── 돌고 있는 타이머 (하루 장 안의 한 줄) ───────────────── */
.timer{ display:flex; align-items:center; gap:11px; margin-top:12px;
  border:1px solid var(--accent); border-radius:16px; padding:9px 11px;
  background:color-mix(in oklab, var(--accent) 6%, var(--card)); }
.timer .ring{ flex:0 0 56px; width:56px; height:56px; position:relative; }
.timer .ring svg{ display:block; transform:rotate(-90deg); }
.timer .ring b{ position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:12.5px; font-weight:normal;
  font-variant-numeric:tabular-nums; }
.timer .mid{ flex:1; min-width:0; }
.timer .who{ font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.timer .sub{ font-size:11px; color:var(--dim); }
.timer .btn{ border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:9px 14px; font:inherit; font-size:13.5px; cursor:pointer; }
.timer .btn.stop{ border-color:var(--sun); color:var(--sun); }

/* ── 팝업 (일정 기입) ─────────────────────────────────── */
#modal{ position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end;
  justify-content:center; }
#modal[hidden]{ display:none; }

/* 팝업에서 넣고 고친다 — 새 줄이면 만들고, 있으면 그 줄을 고친다 */
function taskSave(k, o) {
  if (o.id) { taskSet(k, o.id, { t: o.t, act: o.act, m: o.m }); return o.id; }
  var t = taskAdd(k, o.act);
  taskSet(k, t.id, { t: o.t, m: o.m });
  return t.id;
}
/* 종이 양식처럼 활동별로 묶는다 (한국사·국어·영어… 자리에 운동·토목·영어) */
function taskGroups(k) {
  var ts = tasksOf(k);
  return ACTS.map(function (a) {
    return { act: a, tasks: ts.filter(function (t) { return (t.act || "other") === a.k; }) };
  }).filter(function (g) { return g.tasks.length; });
}
function taskSet(k, id, patch) {
  var t = day(k).tasks.filter(function (x) { return x.id === id; })[0];
  if (!t) return null;
  for (var f in patch) t[f] = patch[f];
  t.upd = now(); touch(); return t;
}
function taskDel(k, id) { taskSet(k, id, { del: true }); }

/* 칸 지우기는 **비움이 아니라 0** 으로 둔다 — 안 그러면 다른 기기의 옛 색이 되살아난다 */
function cellSet(k, slot, act) {
  var d = day(k);
  if (d.cells[slot] === (act || 0)) return false;
  d.cells[slot] = act || 0; d.upd = now(); touch(); return true;
}
function cellMinutes(k) {
  var d = day(k), n = 0;
  for (var s in d.cells) if (d.cells[s]) n++;
  return n * SLOT;
}
/* {활동: 분} — 주간계획 줄과 타일이 같은 셈을 쓴다 */
function actMinutes(k) {
  var d = day(k), out = {};
  for (var s in d.cells) {
    var a = d.cells[s];
    if (a) out[a] = (out[a] || 0) + SLOT;
  }
  return out;
}
function weekMinutes(mon) {
  var out = {}, i, k, m, a;
  for (i = 0; i < 7; i++) {
    k = addDays(mon, i); m = actMinutes(k);
    for (a in m) out[a] = (out[a] || 0) + m[a];
  }
  return out;
}
function sumMin(m) { var n = 0; for (var a in m) n += m[a]; return n; }

/* ── 타이머 기록 ───────────────────────────────────────── */
function sesAdd(s) { D.ses.push(s); touch(); }
function sesOn(k) {
  return D.ses.filter(function (s) { return sheetDate(s.t) === k; })
    .sort(function (a, b) { return a.t - b.t; });
}

/* ── 목표 (D-DAY) ──────────────────────────────────────── */
/* 목표는 기기마다 다를 이유가 없으니 문서에 같이 둔다 */
function goals() {
  return (D.goal || []).filter(function (g) { return !g.del; })
    .sort(function (a, b) { return a.d < b.d ? -1 : 1; });
}
function goalSave(g) {
  D.goal = D.goal || [];
  g.id = g.id || uid(); g.upd = now();
  var i = D.goal.findIndex(function (x) { return x.id === g.id; });
  if (i < 0) D.goal.push(g); else D.goal[i] = g;
  touch();
}
function goalDel(id) {
  D.goal = (D.goal || []).map(function (g) {
    return g.id === id ? { id: id, del: true, upd: now() } : g;
  });
  touch();
}
/* 그 날짜에서 가장 가까운 앞날 목표 */
function ddayOf(k) {
  var gs = goals().filter(function (g) { return g.d >= k; });
  if (!gs.length) return null;
  return { n: gs[0].n, days: diffDays(k, gs[0].d) };
}

/* ── 합치기 (기기 사이) ────────────────────────────────── */
/* 돌려주는 수 = **새로 들어온 것의 개수**. 사람에게 "새 기록 n건" 으로 보여 준다. */
function mergeDoc(inc) {
  if (!inc || typeof inc !== "object") return 0;
  var n = 0, id, k;

  for (id in inc.ev || {}) {
    var mine = D.ev[id], theirs = inc.ev[id];
    if (!mine || (theirs.upd || 0) > (mine.upd || 0)) { D.ev[id] = theirs; n++; }
  }
  for (k in inc.day || {}) n += mergeDay(k, inc.day[k]);

  var seen = {};
  D.ses.forEach(function (s) { seen[s.t + "|" + s.act] = 1; });
  (inc.ses || []).forEach(function (s) {
    var key = s.t + "|" + s.act;
    if (!seen[key]) { D.ses.push(s); seen[key] = 1; n++; }
  });
  D.ses.sort(function (a, b) { return a.t - b.t; });

  (inc.goal || []).forEach(function (g) {
    D.goal = D.goal || [];
    var i = D.goal.findIndex(function (x) { return x.id === g.id; });
    if (i < 0) { D.goal.push(g); n++; }
    else if ((g.upd || 0) > (D.goal[i].upd || 0)) { D.goal[i] = g; n++; }
  });

  prune();
  writeDoc();
  return n;
}
/* 하루 장은 통째로 새 쪽을 취하지 않는다 — 폰에서 칸을 칠하고 PC 에서 메모를 적었을 때
   한쪽이 통째로 날아가기 때문이다. 머리 항목은 새 쪽, 칸은 합집합, 할 일은 id 별로. */
function mergeDay(k, b) {
  if (!b) return 0;
  var a = D.day[k];
  if (!a) { D.day[k] = b; return 1; }
  if (!a.tasks) a.tasks = [];
  if (!a.cells) a.cells = {};
  var n = 0, newer = (b.upd || 0) > (a.upd || 0), f, s;

  if (newer) {
    for (f in { goal: 1, memo: 1, focus: 1 }) {
      if (b[f] !== undefined && b[f] !== a[f]) { a[f] = b[f]; n++; }
    }
  }
  for (s in b.cells || {}) {
    if (!(s in a.cells)) { a.cells[s] = b.cells[s]; n++; }
    else if (newer && a.cells[s] !== b.cells[s]) { a.cells[s] = b.cells[s]; n++; }
  }
  var byId = {};
  a.tasks.forEach(function (t) { byId[t.id] = t; });
  (b.tasks || []).forEach(function (t) {
    var m = byId[t.id];
    if (!m) { a.tasks.push(t); byId[t.id] = t; n++; }
    else if ((t.upd || 0) > (m.upd || 0)) { for (var g in t) m[g] = t[g]; n++; }
  });
  a.upd = Math.max(a.upd || 0, b.upd || 0);
  return n;
}
/* 지운 표시(del)를 반년 넘게 들고 있을 이유는 없다 — 문서가 계속 자란다 */
function prune() {
  var cut = now() - 180 * DAY_MS, id, k;
  for (id in D.ev) if (D.ev[id].del && (D.ev[id].upd || 0) < cut) delete D.ev[id];
  for (k in D.day) {
    var d = D.day[k];
    d.tasks = (d.tasks || []).filter(function (t) { return !(t.del && (t.upd || 0) < cut); });
  }
}

/* ===== 20_toast.js ===== */
/* ── 알림 팝업 ─────────────────────────────────────────────
   화면 안에 글자로 얹으면 다음 그리기에서 지워진다. ms=0 은 다음 알림이 덮을 때까지. */
"use strict";

var _toast = null, _toastT = null;

function say(msg, kind, ms) {
  if (!_toast) {
    _toast = document.createElement("div");
    _toast.id = "toast";
    _toast.setAttribute("hidden", "");
    _toast.innerHTML = '<span></span><button type="button" title="닫기">&times;</button>';
    _toast.querySelector("button").onclick = hush;
    document.body.appendChild(_toast);
  }
  _toast.querySelector("span").textContent = msg;
  _toast.className = kind || "";
  _toast.removeAttribute("hidden");
  requestAnimationFrame(function () { _toast.classList.add("on"); });
  clearTimeout(_toastT);
  var wait = ms === 0 ? 0 : (ms || (kind === "err" ? 5200 : 2600));
  if (wait) _toastT = setTimeout(hush, wait);
}
function hush() {
  if (!_toast) return;
  clearTimeout(_toastT);
  _toast.classList.remove("on");
  setTimeout(function () { if (_toast && !_toast.classList.contains("on")) _toast.setAttribute("hidden", ""); }, 220);
}

/* ===== 30_sync.js ===== */
/* ── 기기 사이 동기화 (GitHub Contents API) ────────────────
   저장소·경로는 **빌드에서 박는다.** 사람이 화면에서 적어 넣게 하면 기기마다 다르게
   적어 어긋난다. 일정은 사생활이라 저장소는 비공개로 두고, 따라서 **읽기에도 토큰이
   필요하다** (정리노트는 공개 저장소라 읽기는 토큰 없이 됐다).

   흐름: 받아서 합치고(mergeDoc) → 합친 것을 올린다(PUT, sha 로 덮어쓰기 확인).
   같은 파일을 다른 기기가 그 사이에 고쳤으면 409 가 오므로 한 번 다시 받아 합친다. */
"use strict";

var REPO = "notjaeyoung0108-lang/j0-plan-data", DPATH = "plan-data.json", SKEY = "j0-plan-sync";
var _syncing = false, _soon = null;

function cfg() {
  try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch (e) { return {}; }
}
function setCfg(c) { localStorage.setItem(SKEY, JSON.stringify(c)); }
function syncWhere() { return { repo: REPO, path: DPATH }; }
function syncReady() { return !!(REPO && cfg().token); }

function ghHeaders() {
  var h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  var t = cfg().token;
  if (t) h.Authorization = "Bearer " + t;   /* 빈 값으로 붙이면 401 이 된다 */
  return h;
}
function ghUrl() {
  return "https://api.github.com/repos/" + REPO + "/contents/" + DPATH;
}
function b64enc(str) {
  var b = new TextEncoder().encode(str), s = "";
  b.forEach(function (x) { s += String.fromCharCode(x); });
  return btoa(s);
}
function b64dec(b64) {
  var bin = atob(String(b64).replace(/\s/g, "")), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}
function why(r, put) {
  if (r.status === 401) return "토큰이 거부됐습니다 (401) — 설정에서 다시 확인하세요";
  if (r.status === 403) return "권한이 없습니다 (403) — 토큰에 이 저장소의 Contents 읽기·쓰기를 주세요";
  if (r.status === 404) return put
    ? "저장소를 찾지 못했습니다 (404) — 이름과 토큰 권한을 확인하세요"
    : "기록 파일이 아직 없습니다";
  if (r.status === 409) return "다른 기기가 먼저 올렸습니다 (409)";
  if (r.status === 422) return "올리지 못했습니다 (422)";
  return "실패 (" + r.status + ")";
}
function fetchGh(url, opt) {
  return fetch(url, opt).catch(function (e) {
    throw new Error("GitHub 에 닿지 못했습니다 — 연결이나 사내망 차단을 확인하세요 (" + e.message + ")");
  });
}

/* 원격을 받아 합친다. → {sha, n, missing} */
async function pull() {
  var r = await fetchGh(ghUrl() + "?t=" + now(), { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 404) return { sha: null, n: 0, missing: true };
  if (!r.ok) throw new Error(why(r, false));
  var j = await r.json();
  var doc = {};
  try { doc = JSON.parse(b64dec(j.content || "")); }
  catch (e) { throw new Error("기록 파일이 깨져 있습니다 — 설정에서 내보내기로 백업 후 살펴보세요"); }
  return { sha: j.sha, n: mergeDoc(doc), missing: false };
}

async function push(sha) {
  var body = {
    message: "plan: " + new Date().toISOString().slice(0, 16).replace("T", " "),
    content: b64enc(JSON.stringify({ v: 1, ev: D.ev, day: D.day, ses: D.ses, goal: D.goal || [] }))
  };
  if (sha) body.sha = sha;
  var r = await fetchGh(ghUrl(), {
    method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)
  });
  if (r.status === 409 || r.status === 422) return false;    /* 부르는 쪽에서 한 번 다시 */
  if (!r.ok) throw new Error(why(r, true));
  return true;
}

/* quiet=true 면 "맞추는 중" 같은 말을 하지 않는다 (열 때·초점 돌아올 때) */
async function syncNow(quiet) {
  if (_syncing) return;
  if (!REPO) { if (!quiet) say("동기화 저장소가 정해지지 않았습니다 (빌드에서 박습니다)", "err"); return; }
  if (!cfg().token) { if (!quiet) say("설정에서 GitHub 토큰을 먼저 넣으세요", "err"); return; }
  _syncing = true;
  if (!quiet) say("맞추는 중…", "", 0);
  try {
    var got = await pull();
    var ok = true;
    if (isDirty() || got.missing) {
      ok = await push(got.sha);
      if (!ok) { got = await pull(); ok = await push(got.sha); }   /* 한 번만 다시 */
      if (ok) setDirty(false);
    }
    var c = cfg(); c.last = now(); setCfg(c);
    render();
    if (!quiet || got.n) {
      say((ok ? "맞췄습니다" : "올리지 못했습니다 — 잠시 뒤 다시 시도합니다")
          + (got.n ? " · 새 기록 " + got.n + "건" : ""), ok ? "ok" : "err");
    }
  } catch (e) {
    if (!quiet) say(e.message, "err");
  }
  _syncing = false;
}

/* 고칠 때마다 올리면 커밋이 수십 개씩 쌓인다 — 손을 뗀 뒤 한 번만 */
function syncSoon() {
  if (!syncReady()) return;
  clearTimeout(_soon);
  _soon = setTimeout(function () { syncNow(true); }, 6000);
}
window.syncSoon = syncSoon;

/* ===== 40_modal.js ===== */
/* ── 팝업 ──────────────────────────────────────────────────
   일정은 화면을 옮기지 않고 **그 자리에서 팝업으로** 넣고 고친다. 달력을 보던 눈이
   딴 화면으로 튀지 않는 게 요점이라, 폰에서는 아래에서 올라오는 판으로 띄운다. */
"use strict";

var MODAL = document.getElementById("modal");
var _popEsc = null;

function openPop(html, wire) {
  MODAL.innerHTML = '<div class="veil"></div><div class="pop" role="dialog" '
                  + 'aria-modal="true">' + html + "</div>";
  MODAL.removeAttribute("hidden");
  document.body.style.overflow = "hidden";
  MODAL.querySelector(".veil").onclick = closePop;
  var x = MODAL.querySelector(".pop .x");
  if (x) x.onclick = closePop;
  _popEsc = function (e) { if (e.key === "Escape") closePop(); };
  document.addEventListener("keydown", _popEsc);
  if (wire) wire(MODAL.querySelector(".pop"));
}
function closePop() {
  MODAL.setAttribute("hidden", "");
  MODAL.innerHTML = "";
  document.body.style.overflow = "";
  if (_popEsc) { document.removeEventListener("keydown", _popEsc); _popEsc = null; }
}
var q = function (root, sel) { return root.querySelector(sel); };
var qa = function (root, sel) { return [].slice.call(root.querySelectorAll(sel)); };

        b.onclick = function () {
          e.cat = b.getAttribute("data-k");
          qa(p, ".cats button").forEach(function (o) { o.classList.remove("on"); });
          b.classList.add("on");
        };
      });
      /* 시작을 뒤로 밀면 종료도 따라간다 — 안 그러면 조용히 뒤집힌 일정이 생긴다 */
      q(p, "#s").onchange = function () {
        if (q(p, "#e").value < this.value) q(p, "#e").value = this.value;
      };
      q(p, "#no").onclick = closePop;
      if (!isNew) q(p, "#rm").onclick = function () {
        if (!confirm("이 일정을 지울까요?")) return;
        evDel(e.id); closePop(); render(); say("지웠습니다", "ok");
      };
      q(p, "#ok").onclick = function () {
        var t = q(p, "#t").value.trim();
        if (!t) { q(p, "#t").focus(); say("제목을 적어 주세요", "err"); return; }
        var s = q(p, "#s").value || today(), en = q(p, "#e").value || s;
        evSave({ id: e.id, cat: e.cat, t: t, s: s, e: en < s ? s : en,
                 tm: q(p, "#tm").value || "", memo: q(p, "#memo").value.trim() });
        closePop(); render(); say(isNew ? "넣었습니다" : "고쳤습니다", "ok");
      };
      setTimeout(function () { if (isNew) q(p, "#t").focus(); }, 60);
    });
}

/* ===== 50_month.js ===== */
/* ── 화면 1: 월 달력 (이벤트만) ─────────────────────────────
   빈 칸을 채우는 달력이 아니라 **일정이 있는 곳만 보이는** 달력이다. 여러 날에 걸친
   일정은 주 단위로 잘라 **끊기지 않은 막대 하나**로 눕힌다 (사진의 '경주 여행' 처럼).
   막대가 서로 겹치지 않게 줄(lane)을 아래로 쌓고, 세 줄을 넘으면 마지막 줄은 '+N'. */
"use strict";

var MAX_LANES = 3;

function viewMonth(mk) {
  var app = document.getElementById("app");
  var m = +mk.slice(5, 7), y = mk.slice(0, 4);
  head("인생계획", null);
  app.innerHTML =
      '<div class="mnav"><button id="prev" title="지난달">&#8249;</button>'
    + '<span class="m">' + m + "월</span>" + '<span class="y">' + y + "년</span>"
    + '<span class="sp"></span><button class="t" id="tod">오늘</button>'
    + '<button id="next" title="다음달">&#8250;</button></div>'
    + '<div class="cal">'
    + '<div class="wk">' + [0, 1, 2, 3, 4, 5, 6].map(function (d) {
        return "<span>" + WD[d] + "</span>";
      }).join("") + "</div>"
    + monthWeeks(mk)
    + "</div>"
    + weekSection();

  q(app, "#prev").onclick = function () { go("m-" + shiftMonth(mk, -1)); };
  q(app, "#next").onclick = function () { go("m-" + shiftMonth(mk, 1)); };
  q(app, "#tod").onclick = function () { go("m-" + monthOf(today())); };
  qa(app, ".hit button").forEach(function (b) {
    b.onclick = function () { popDay(b.getAttribute("data-d")); };
  });
  qa(app, ".bar[data-id]").forEach(function (b) {
    b.onclick = function (e) { e.stopPropagation(); popEvent(D.ev[b.getAttribute("data-id")]); };
  });
  qa(app, ".bar.more").forEach(function (b) {
    b.onclick = function (e) { e.stopPropagation(); popDay(b.getAttribute("data-d")); };
  });
  wireWeekSection(app);
}

function shiftMonth(mk, n) {
  var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n;
  var d = new Date(y, m, 1);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1);
}

function monthWeeks(mk) {
  var first = mk + "-01";
  var last = ymd(new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0));   /* 그 달 마지막 날 */
  var out = "", w = weekStart(first);
  while (w <= last) { out += weekRow(w, mk); w = addDays(w, 7); }
  return out;
}

/* 한 주 한 줄. 날짜 번호 · 막대 · 그 아래 투명한 클릭 칸(7개)로 겹쳐 놓는다. */
function weekRow(wa, mk) {
  var days = [], i;
  for (i = 0; i < 7; i++) days.push(addDays(wa, i));
  var wb = days[6], tod = today();

  var segs = evBetween(wa, wb).map(function (e) {
    var p = evSpan(e);
    return { e: e, a: Math.max(0, diffDays(wa, p.s)), b: Math.min(6, diffDays(wa, p.e)),
             starts: p.s >= wa, ends: p.e <= wb };
  });
  /* 긴 일정이 위로 — 짧은 것이 먼저 자리를 잡으면 긴 막대가 아래로 밀려 계단이 된다 */
  segs.sort(function (x, y) {
    return (y.b - y.a) - (x.b - x.a) || (x.a - y.a) || evSort(x.e, y.e);
  });
  var lanes = [];
  segs.forEach(function (s) {
    for (var i = 0; ; i++) {
      if (!lanes[i]) lanes[i] = [];
      var free = lanes[i].every(function (o) { return s.b < o.a || s.a > o.b; });
      if (free) { lanes[i].push(s); s.lane = i; break; }
    }
  });
  /* 넘치면 마지막 줄을 '+N' 에 내준다 */
  var cap = lanes.length > MAX_LANES ? MAX_LANES - 1 : MAX_LANES;
  var over = [0, 0, 0, 0, 0, 0, 0];
  segs.forEach(function (s) {
    if (s.lane >= cap) for (var d = s.a; d <= s.b; d++) over[d]++;
  });

  var bars = segs.filter(function (s) { return s.lane < cap; }).map(function (s) {
    var c = catOf(s.e.cat);
    var cls = "bar" + (s.starts && s.ends ? "" : s.starts ? " start" : s.ends ? " end" : " mid");
    /* 막대에는 제목만 넣는다 — 폰 폭에서 시간까지 넣으면 '19:0…' 처럼 제목이 통째로
       잘려 무슨 일정인지 알 수 없게 된다. 시간은 날짜를 눌렀을 때 팝업에서 보인다. */
    var label = (s.starts || s.a === 0) ? (s.e.t || "") : "";
    return '<button class="' + cls + '" data-id="' + s.e.id + '" style="--c:' + c.c
         + ";grid-row:" + (s.lane + 1) + ";grid-column:" + (s.a + 1) + "/" + (s.b + 2)
         + '" title="' + esc(s.e.t) + '">' + esc(label) + "</button>";
  }).join("")
  + over.map(function (n, d) {
    return n ? '<button class="bar more" data-d="' + days[d] + '" style="grid-row:'
             + (cap + 1) + ";grid-column:" + (d + 1) + "/" + (d + 2) + '">+' + n + "</button>" : "";
  }).join("");

  var nums = days.map(function (dd) {
    var dow = dateOf(dd).getDay(), out = monthOf(dd) !== mk;
    return "<span class=\"s" + dow + (out ? " out" : "") + (dd === tod ? " now" : "") + '">'
         + dateOf(dd).getDate() + "</span>";
  }).join("");
  var hits = days.map(function (dd) {
    return '<button data-d="' + dd + '" class="' + (monthOf(dd) !== mk ? "out" : "")
         + '" aria-label="' + fmtDay(dd) + '"></button>';
  }).join("");

  return '<div class="wrow"><div class="hit">' + hits + "</div>"
       + '<div class="nums">' + nums + "</div>"
       + '<div class="bars">' + bars + "</div></div>";
}

/* ===== 60_week.js ===== */
/* ── 화면 1 아래: 주간계획 (요일 가로 7열) ──────────────────
   달력이 '무슨 일이 있는가' 라면 주간계획은 '그 주를 어떻게 썼는가' 다.
   일요일부터 토요일까지 **가로로 7칸**, 한 칸이 하루다. 칸에는 그날 일정과 활동 시간이
   세로 막대로 쌓이고, 누르면 그 날의 텐미닛 플래너로 넘어간다.

   글자를 키우려고 세로 목록으로 두면 주 전체가 한눈에 안 들어온다 — 이 화면의 값은
   '한 주가 한 그림' 이라는 데 있으므로, 자세한 것은 하루 장에 맡기고 여기서는 흐름만 본다. */
"use strict";

var WK_BAR = 46;                    /* 막대 최대 높이(px) */
var WK_FULL = 8 * 60;               /* 이 시간이면 막대가 꽉 찬다 (8시간) */
var WK_CHIPS = 2;                   /* 칸에 보일 일정 개수, 넘으면 +N */

function weekSection(sun) {
  sun = sun || weekStart(today());
  var wm = weekMinutes(sun), tod = today();
  var evN = evBetween(sun, addDays(sun, 6)).length;

  var cols = "", i;
  for (i = 0; i < 7; i++) {
    var k = addDays(sun, i), dow = i;
    var evs = evOn(k), am = actMinutes(k), tot = sumMin(am);
    var ts = tasksOf(k), doneN = ts.filter(function (t) { return taskSt(t) === 1; }).length;

    var chips = evs.slice(0, WK_CHIPS).map(function (e) {
      var c = catOf(e.cat);
      return '<i class="chip hand" style="--c:' + c.c + '">' + esc(e.t) + "</i>";
    }).join("")
      + (evs.length > WK_CHIPS ? '<i class="chip more">+' + (evs.length - WK_CHIPS) + "</i>" : "");

    /* 활동 시간을 세로로 쌓는다 — 색만 봐도 그날 무엇에 시간을 썼는지 읽힌다 */
    var segs = ACTS.filter(function (a) { return am[a.k]; }).map(function (a) {
      var h = Math.max(3, Math.round(WK_BAR * Math.min(1, am[a.k] / WK_FULL)));
      return '<em style="--c:' + a.c + ";height:" + h + 'px" title="' + a.n + " "
           + fmtMin(am[a.k]) + '"></em>';
    }).join("");

    cols += '<a class="col s' + dow + (k === tod ? " now" : "") + '" href="#d-' + k + '">'
      + '<b class="wd">' + WD[dow] + "</b>"
      + '<span class="dn">' + dateOf(k).getDate() + "</span>"
      + '<span class="cev">' + chips + "</span>"
      + '<span class="bar">' + segs + "</span>"
      + '<span class="tot">' + (tot ? esc(fmtHM(tot)) : "&middot;") + "</span>"
      + '<span class="tk">' + (ts.length ? doneN + "/" + ts.length : "&nbsp;") + "</span>"
      + "</a>";
  }

  return '<h2>주간계획<span class="r">'
       + esc(fmtDay(sun).replace(/ \(.\)$/, "")) + " ~ "
       + esc(fmtDay(addDays(sun, 6)).replace(/ \(.\)$/, "")) + "</span></h2>"
       + '<div class="wk7">' + cols + "</div>"
       + '<div class="tiles">'
       + tile("토목공부", fmtMin(wm.civil || 0), "이번 주", !!wm.civil)
       + tile("영어공부", fmtMin(wm.eng || 0), "이번 주", !!wm.eng)
       + tile("운동", fmtMin(wm.exer || 0), "이번 주", !!wm.exer)
       + tile("이번 주 일정", evN + '<u>개</u>', "채운 시간 " + fmtMin(sumMin(wm)))
       + "</div>";
}

function wireWeekSection() { /* 칸이 그냥 링크라 붙일 것이 없다 — 라우터가 받는다 */ }

function tile(k, v, sub, hot) {
  return '<div class="tile' + (hot ? " hot" : "") + '">'
       + '<div class="k">' + esc(k) + "</div><div class=\"v\">" + v + "</div>"
       + (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
}

/* ===== 70_day.js ===== */
/* ── 화면 2: 텐미닛 플래너 (하루 한 장) ─────────────────────
   **속지를 그대로 옮긴다.** 라벨(YEAR / MONTH / DAY · D-DAY · COMMENT · TOTAL TIME ·
   TASKS)은 회색이고 뒤로 줄이 이어진다. 표의 선도 모두 회색.

     ┌ YEAR / MONTH / DAY ──────  │  D-DAY ─────────────
     │ 260820 목요일              │  D-52  영어 시험
     ├ COMMENT ─────────────────  │  TOTAL TIME ────────
     │ 오늘 한 줄                 │  6H00M
     └──────────────────────────  └─────────────────────
       TASKS ──────────────────────────────
       과목 │ 할 일            ▶ │ ○ ×  │ 10 20 30 40 50 60
       ─────┼────────────────────┼──────│ 5 □□□□□□
                                        │ 6 □□□□□□  …

   빈 줄은 종이처럼 그대로 두고, 누르면 **팝업**이 떠서 활동·할 일·메모를 적는다
   (좁은 칸에 직접 적게 하면 폰에서 글자가 잘리고 메모 자리가 없다).
   타임테이블은 속지처럼 5시에서 시작하고, 칠한 칸이 곧 TOTAL TIME 이다. */
"use strict";

var AKEY = "j0-plan-act";
var curAct = localStorage.getItem(AKEY) || "civil";
var MIN_ROWS = 12;                     /* 종이처럼 남겨 두는 빈 줄 수 */
var _deb = {};
function deb(key, fn, ms) { clearTimeout(_deb[key]); _deb[key] = setTimeout(fn, ms || 700); }

/* 속지의 라벨 — 회색 글자 뒤로 줄이 끝까지 이어진다 */
function flabel(t, right) {
  return '<div class="fl">' + t + "<i></i>" + (right || "") + "</div>";
}

function viewDay(k) {
  var app = document.getElementById("app");
  var d = day(k), dd = ddayOf(k), dow = dateOf(k).getDay();
  head(fmtDay(k), "달력", "m-" + monthOf(k));

  app.innerHTML =
      '<div class="sheet">'
    /* 머리 — 날짜 / D-DAY */
    + '<div class="fgrid">'
    + '<div class="fc">' + flabel("year / month / day")
    + '<div class="fv big">' + k.slice(2).replace(/-/g, "") + " "
    + WD[dow] + "요일</div></div>"
    + '<div class="fc">' + flabel("d-day")
    + '<div class="fv dd">' + (dd ? (dd.days === 0 ? "D-DAY" : "D-" + dd.days) : "&mdash;")
    + (dd ? "<small>" + esc(dd.n) + "</small>" : "") + "</div></div>"
    /* 한 줄 다짐 / 칠한 칸 합계 — 아래 선까지 속지와 같게 */
    + '<div class="fc rule">' + flabel("comment")
    + '<input id="goal" class="fv hand" value="' + esc(d.goal || "")
    + '" placeholder="오늘 한 줄" autocomplete="off"></div>'
    + '<div class="fc rule">' + flabel("total time")
    + '<div class="fv tot" id="sum">' + fmtHMFull(cellMinutes(k)) + "</div></div>"
    + "</div>"

    /* 그날 일정 — 속지에는 없지만 달력과 이어져야 하므로 같은 서식으로 붙인다 */
    + '<div class="evstrip" id="evs">' + dayEvsHtml(k) + "</div>"

    /* 돌고 있는 타이머 */
    + '<div id="trun">' + runStrip() + "</div>"

    /* TASKS 와 TIMETABLE — 속지처럼 좌우 2단 */
    + flabel("tasks", '<span id="tsum">' + taskSum(k) + "</span>")
    + '<div class="cols">'
    + '<div class="lt"><div class="ftable" id="tasks">' + tasksHtml(k) + "</div></div>"
    + '<div class="rt"><div class="tt hm" id="tt">' + ttHtml(k) + "</div>"
    + '<div class="pal" id="acts">' + palette() + "</div></div>"
    + "</div>"

    + focusHtml(d.focus || 0)
    + flabel("memo")
    + '<textarea class="memo hand" id="memo" placeholder="오늘 남길 말">'
    + esc(d.memo || "") + "</textarea>"
    + "</div>"

    /* 날짜 이동 */
    + '<div class="tools" style="justify-content:space-between">'
    + '<button id="pd">&#8249; ' + esc(fmtDay(addDays(k, -1)).replace(/ \(.\)$/, "")) + "</button>"
    + '<button id="td">오늘</button>'
    + '<button id="nd">' + esc(fmtDay(addDays(k, 1)).replace(/ \(.\)$/, "")) + " &#8250;</button>"
    + "</div>";

  /* ── 손대는 곳마다 모델만 고치고 화면은 그 자리에서 손본다 ──
     글자를 적는 중에 화면을 다시 그리면 커서가 튄다. */
  q(app, "#goal").oninput = function () {
    var v = this.value; deb("goal", function () { daySet(k, { goal: v }); });
  };
  q(app, "#memo").oninput = function () {
    var v = this.value; deb("memo", function () { daySet(k, { memo: v }); });
  };
  qa(app, "#evs .ev").forEach(function (el) {
    el.onclick = function () { popEvent(D.ev[el.getAttribute("data-id")]); };
  });
  q(app, "#evadd").onclick = function () { popEvent({ s: k, e: k, cat: "etc" }); };
  wireTasks(app, k);
  wireRun(app, k);
  wireFocus(app, k);
  wireActs(app, k);
  wireTT(app, k);
  q(app, "#pd").onclick = function () { go("d-" + addDays(k, -1)); };
  q(app, "#nd").onclick = function () { go("d-" + addDays(k, 1)); };
  q(app, "#td").onclick = function () { go("d-" + today()); };
}

/* ── 그날 일정 (읽기 전용 줄, 누르면 팝업) ────────────────── */
function dayEvsHtml(k) {
  var list = evOn(k);
  var rows = list.map(function (e) {
    var c = catOf(e.cat), sp = evSpan(e);
    var span = sp.s !== sp.e
      ? " (" + (diffDays(sp.s, k) + 1) + "/" + (diffDays(sp.s, sp.e) + 1) + "일)" : "";
    return '<div class="ev" data-id="' + e.id + '" style="--c:' + c.c + '">'
         + '<span class="hand">' + esc(e.t) + "</span>"
         + '<span class="tm">' + (e.tm ? esc(e.tm) : "종일") + esc(span) + "</span></div>";
  }).join("");
  return flabel("일정", '<button id="evadd" title="일정 추가">+</button>')
       + (rows || '<div class="hint">이 날 일정은 없습니다</div>');
}

/* ── TASKS — 과목칸 · 본문 · 체크칸 3단 괘선표 ─────────────── */
function tasksHtml(k) {
  var gs = taskGroups(k), t = tState(), rows = "", n = 0, last = "";
  gs.forEach(function (g) {
    g.tasks.forEach(function (x) {
      rows += taskRow(x, t, g.act.k !== last ? g.act : null);
      last = g.act.k; n++;
    });
  });
  for (; n < MIN_ROWS; n++) rows += '<div class="frow blank"><span class="g"></span>'
    + '<span class="m"></span><span class="r"></span></div>';
  return rows;
}
function taskRow(x, t, act) {
  var a = actOf(x.act), st = taskSt(x), run = t && t.tid === x.id;
  return '<div class="frow task st' + st + (run ? " run" : "") + '" data-id="' + x.id + '">'
    + '<span class="g" style="color:' + a.c + '">' + (act ? esc(act.s || act.n) : "") + "</span>"
    + '<span class="m"><button class="ttl hand" title="눌러 고치기" style="--c:' + a.c
    + ";--w:" + a.w + '">' + esc(x.t || "")
    + (x.m ? '<i class="md" title="메모 있음"></i>' : "") + "</button>"
    + '<button class="run" title="' + (run ? "끝내고 기록" : "이 할 일로 타이머 시작") + '">'
    + (run ? "&#9632;" : "&#9654;") + "</button></span>"
    + '<span class="r"><button class="mk ok" title="했다">&#9711;</button>'
    + '<button class="mk no" title="못했다">&times;</button></span></div>';
}
function taskSum(k) {
  var ts = tasksOf(k);
  if (!ts.length) return "";
  return ts.filter(function (x) { return taskSt(x) === 1; }).length + "/" + ts.length;
}
/* 활동을 바꾸거나 줄을 지우면 묶음 순서가 달라진다 — 표만 다시 그린다 */
function redrawTasks(k, focusId) {
  var box = document.getElementById("tasks");
  if (!box) return;
  box.innerHTML = tasksHtml(k);
  document.getElementById("tsum").textContent = taskSum(k);
  wireTasks(document, k);
  if (focusId) {
    var el = box.querySelector('.frow[data-id="' + focusId + '"] input.t');
    if (el) el.focus();
  }
}
function wireTasks(root, k) {
  /* 빈 줄은 종이의 빈 칸이다 — 누르면 그 자리에 한 줄 생긴다 */
  qa(root, "#tasks .frow.blank").forEach(function (el) {
    el.onclick = function () { popTask(k, null); };
  });
  qa(root, "#tasks .frow.task").forEach(function (el) {
    var id = el.getAttribute("data-id");
    var get = function () {
      return tasksOf(k).filter(function (x) { return x.id === id; })[0];
    };
    q(el, ".ttl").onclick = function () { popTask(k, get()); };
    q(el, ".mk.ok").onclick = function () { mark(k, id, 1, el); };
    q(el, ".mk.no").onclick = function () { mark(k, id, 2, el); };

function wireTT(app, k) {

/* ===== 75_timer.js ===== */
/* ── 타이머 ─────────────────────────────────────────────────
   뽀모도로 폴더의 것을 끌어오지 않고 앱 안에 새로 둔다. 서버도 노션도 끼지 않으므로
   폰에서 단독으로 돌고, **끝난 세션만** 문서에 들어가 다른 기기로 넘어간다.
   돌고 있는 상태는 그 기기에만 있다 (두 기기에서 같이 돌 일이 없다).

   할 일 줄의 ▶ 로 시작하고 ■ 로 끝낸다. 끝내면 그 시간대의 10분 칸이 저절로 칠해진다
   — 종이라면 손으로 칠할 자리다. */
"use strict";

var TKEY = "j0-plan-timer", POMO = 25, MS = 60000;
/* 켜둔 채 앱을 닫아 버렸을 때의 상한. 뽀모도로는 25분에서 끊고, 자유 모드도 여섯 시간이
   넘으면 그만큼만 기록한다 — 안 그러면 하루를 통째로 칠해 버린다. */
var FREE_CAP = 6 * 60;
var _tick = null;

function tState() {
  try {
    var t = JSON.parse(localStorage.getItem(TKEY) || "null");
    return t && t.start ? t : null;
  } catch (e) { return null; }
}
function tMode() { return localStorage.getItem("j0-plan-tmode") || "pomo"; }

function timerStart(act, label, tid) {
  if (tState()) timerStop(true);          /* 돌던 것은 먼저 끝내 기록한다 */
  localStorage.setItem(TKEY, JSON.stringify({
    act: act, label: label || "", tid: tid || "", start: now(), mode: tMode()
  }));
  render();
}
function timerStop(quiet) {
  var t = tState();
  if (!t) return;
  localStorage.removeItem(TKEY);
  var cap = (t.mode === "pomo" ? POMO : FREE_CAP) * MS;
  var end = Math.min(now(), t.start + cap);        /* 넘긴 만큼은 버린다 */
  var min = Math.round((end - t.start) / MS);
  if (min < 1) { render(); if (!quiet) say("1분이 안 돼 기록하지 않았습니다"); return; }
  fillSpan(t.start, end, t.act);
  sesAdd({ t: t.start, min: min, act: t.act, label: t.label || "" });
  render();
  say((t.label || actOf(t.act).n) + " " + fmtMin(min) + " 기록했습니다"
      + (now() - t.start > cap + MS ? " (상한까지만)" : ""), "ok");
}
/* 걸친 칸은 칠한다 — 07:05~07:35 면 07:00·07:10·07:20·07:30 네 칸 */
function fillSpan(a, b, act) {
  var step = SLOT * MS, t = Math.floor(a / step) * step, n = 0;
  for (; t < b && n < 24 * 6; t += step, n++) {
    cellSet(sheetDate(t), slotKey(slotOfTime(t)), act);
  }
}
function beep() {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    var c = new C(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.9);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.95);
  } catch (e) { /* 소리를 못 내도 기록은 남는다 */ }
}

/* ── 화면 ────────────────────────────────────────────────── */
function ring(frac, color) {
  var r = 24, C = 2 * Math.PI * r;
  return '<svg width="56" height="56" viewBox="0 0 56 56">'
       + '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="4.5"/>'
       + '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + color
       + '" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1)
       + '" stroke-dashoffset="' + (C * (1 - Math.min(1, frac))).toFixed(1) + '"/></svg>';
}
/* 돌고 있을 때만 하루 장 위에 한 줄 뜬다 */
function runStrip() {
  var t = tState();
  if (!t) return "";
  var a = actOf(t.act), el = (now() - t.start) / 1000;
  var dur = t.mode === "pomo" ? POMO * 60 : 3600;
  return '<div class="timer" data-run="1"><div class="ring">'
    + ring((el % dur) / dur, a.c) + '<b>' + fmtClock(el) + "</b></div>"
    + '<div class="mid"><div class="who hand">' + esc(t.label || a.n) + "</div>"
    + '<div class="sub">' + esc(a.n) + " · "
    + new Date(t.start).toTimeString().slice(0, 5) + " 시작"
    + (t.mode === "pomo" ? " · " + POMO + "분에 알림" : "") + "</div></div>"
    + '<button class="btn stop" id="tstop">종료</button></div>';
}
function wireRun(app) {
  var b = q(app, "#tstop");
  if (b) b.onclick = function () { timerStop(); };
}

/* 1초마다 숫자와 고리만 손본다. 화면을 다시 그리면 적던 글자가 날아간다. */
function timerLoop() {
  clearInterval(_tick);
  _tick = setInterval(function () {
    var t = tState();
    var pill = document.getElementById("runpill");
    if (!t) { if (pill) pill.remove(); return; }
    var el = (now() - t.start) / 1000;
    var box = document.querySelector('.timer[data-run="1"]');
    if (box) {
      var lab = box.querySelector("b");
      if (lab) lab.textContent = fmtClock(el);
      var dur = t.mode === "pomo" ? POMO * 60 : 3600;
      var c = box.querySelectorAll("circle")[1], r = 24, C = 2 * Math.PI * r;
      if (c) c.setAttribute("stroke-dashoffset", (C * (1 - Math.min(1, (el % dur) / dur))).toFixed(1));
    }
    if (pill) pill.querySelector("b").textContent = fmtClock(el);
    /* 뽀모도로는 25분에서, 자유 모드는 상한에서 스스로 끊는다 */
    if (t.mode === "pomo" && el >= POMO * 60) {
      beep(); timerStop(true);
      say(POMO + "분 채웠습니다 — 기록했습니다", "ok", 6000);
    } else if (t.mode === "free" && el >= FREE_CAP * 60) {
      timerStop(true);
      say("자유 모드 상한 " + fmtMin(FREE_CAP) + " 까지 기록했습니다", "ok", 6000);
    }
  }, 1000);
}
/* 돌고 있으면 어느 화면에서든 알약이 떠 있고, 누르면 그 날 장으로 간다 */
function timerPill() {
  var t = tState(), pill = document.getElementById("runpill");
  if (!t) { if (pill) pill.remove(); return; }
  if (!pill) {
    pill = document.createElement("a");
    pill.id = "runpill";
    document.body.appendChild(pill);
  }
  pill.href = "#d-" + sheetDate(t.start);
  pill.style.setProperty("--c", actOf(t.act).c);
  pill.innerHTML = '<i class="dot" style="background:' + actOf(t.act).c + '"></i>'
                 + esc(t.label || actOf(t.act).n) + " <b>"
                 + fmtClock((now() - t.start) / 1000) + "</b>";
}

/* ===== 90_app.js ===== */
/* ── 라우터 · 부팅 ──────────────────────────────────────────
   화면은 주소 한 칸으로 갈린다:  (없음)·m-2026-08 = 달력 / d-2026-08-19 = 하루 장 / set = 설정
   그래야 폰에서 뒤로가기가 앱처럼 동작하고, 링크로 그 날을 바로 열 수 있다. */
"use strict";

var _backTo = "";

function head(title, backLabel, backTo) {
  document.getElementById("ttl").textContent = title;
  document.getElementById("back").disabled = !backLabel;
  document.getElementById("backl").textContent = backLabel || "달력";
  _backTo = backTo || "";
}
function go(h) { location.hash = h; }

function route() {
  var h = decodeURIComponent(location.hash.replace(/^#/, "")), m;
  if (h.indexOf("t=") === 0) {                 /* 폰에 토큰 넣기: 주소 끝에 #t=… */
    var c = cfg(); c.token = h.slice(2).trim(); setCfg(c);
    history.replaceState(null, "", location.pathname + location.search + "#set");
    say("토큰을 저장했습니다", "ok");
    viewSet();
    syncNow(true);
    return;
  }
  if (h === "set") return viewSet();
  if ((m = h.match(/^d-(\d{4}-\d{2}-\d{2})$/))) return viewDay(m[1]);
  if ((m = h.match(/^m-(\d{4}-\d{2})$/))) return viewMonth(m[1]);
  return viewMonth(monthOf(today()));
}
/* 다시 그리기 — 동기화나 저장 뒤에 부른다. 보던 자리를 잃지 않게 스크롤을 되돌린다. */
function render() {
  var y = window.scrollY;
  route();
  timerPill();
  window.scrollTo(0, y);
}
